{% extends 'gestion/base.html' %}
{% load static %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'gestion/css/crud.css' %}">{% endblock %}

{% block content %}
<div class="confirm-box">
    <h3> ¿Eliminar registro?</h3>
    <p>¿Estás seguro de que deseas eliminar <strong>"{{ nombre }}"</strong>?<br>Esta acción no se puede deshacer.</p>
    <form method="post">
        {% csrf_token %}
        <div class="confirm-actions">
            <button type="submit" class="btn btn-danger">🗑️ Sí, eliminar</button>
            <a href="{% url volver %}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
